# The dongle is USB-powered and always plugged in, so it never deep sleeps —
# a sleeping central can't be woken by the halves' keys and would appear dead
# until re-plugged. Guards against future power settings in kometa.conf
# leaking into this build the way corne.conf does into the corne dongle.
#
# Note: kometa.conf's CONFIG_ZMK_PM_SOFT_OFF=y leaks in here by design —
# it keeps the keymap's ADJ soft-off key working through the dongle
# (pressing it powers the dongle down — re-plug USB to restart — and
# turns the halves off as well).
CONFIG_ZMK_SLEEP=n