# nice!view display
CONFIG_ZMK_DISPLAY=y

# --- Power & display tuning -------------------------------------------------
# nice!view's shield conf disables idle blanking, which leaves ZMK's 10 ms
# display tick running (~100 CPU wakeups/second) forever — the main battery
# drain on these halves. MIP panels hold their image with no power, so pausing
# updates when idle costs nothing: the screen keeps showing the last frame
# and resumes on the next keypress. Every redraw on this panel type is a
# full-frame update with a brief visible flash (WPM graph while typing,
# layer switches, battery-percent steps) — that's inherent to the panel.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=100

# Sample the battery less often: fewer idle wakeups and fewer idle screen
# refreshes (each battery-percent change triggers a visible full redraw).
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=120

# Deep sleep: fully power the halves off after 30 min of inactivity (the
# corne kscan already carries wakeup-source, so any keypress wakes them;
# Bluetooth needs a few seconds to reconnect). Unsaved ZMK Studio changes
# held in RAM are lost when deep sleep kicks in — save in Studio first.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# ZMK Studio is enabled on the left/central half via build.yaml
# (see `studio-rpc-usb-uart` snippet and CONFIG_ZMK_STUDIO cmake-arg there)

# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y