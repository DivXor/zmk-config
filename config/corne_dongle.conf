# The dongle is USB-powered and always plugged in, so it never deep sleeps —
# a sleeping central can't be woken by the halves' keys and would appear dead
# until re-plugged. This also overrides config/corne.conf, whose sleep/display
# settings leak into this build because the `corne_dongle` shield resolves to
# the `corne` config-name candidates.
CONFIG_ZMK_SLEEP=n

# Keep the prospector status screen awake — no battery to save.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n