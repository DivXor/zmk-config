# Increase BLE transmit power for dongle
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable deep sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Configure split keyboard - expect 6 peripherals (totem L/R + corne L/R +
# kometa L/R; bond all six, connect to whichever halves are powered on)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=6

# Fetch battery levels from peripherals for display
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# 6 peripherals + 2 spare BT host profiles
CONFIG_BT_MAX_CONN=8
CONFIG_BT_MAX_PAIRED=8

# "UNIVERSAL DONGLE" is 16 chars; Zephyr's hci_core requires device name
# length < BT_DEVICE_NAME_MAX (ZMK default 16), so bump the limit.
CONFIG_BT_DEVICE_NAME_MAX=17

CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

# Prospector display configuration - Operator layout (technical, info-dense)
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y