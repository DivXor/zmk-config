# Increase BLE transmit power for dongle
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# USB-powered and always connected: never deep sleep — a sleeping central
# can't be woken by the halves' keys and would appear dead until re-plugged.
# (config/corne_dongle.conf re-asserts this against corne.conf leakage.)
CONFIG_ZMK_SLEEP=n

# Configure split keyboard - expect 4 peripherals (corne L/R + kometa L/R,
# whichever halves are powered on; bond all four)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=4

# Fetch battery levels from peripherals for display
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

# Prospector display configuration - Operator layout (technical, info-dense)
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y