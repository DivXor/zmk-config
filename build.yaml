  - board: xiao_ble//zmk
    shield: kometa_dongle prospector_adapter
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/cal_kometa.keymap
    snippet: zmk-usb-logging studio-rpc-usb-uart
    artifact-name: kometa-cal-dongle

  # Settings reset
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: xiao_reset_settings
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: nice_nano_reset_settings