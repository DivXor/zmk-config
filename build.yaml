include:
  # Totem (standalone halves as today + totem dongle)
  - board: xiao_ble//zmk
    shield: totem_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: totem-dongle-left
  - board: xiao_ble//zmk
    shield: totem_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: totem-dongle-right
  - board: xiao_ble//zmk
    shield: totem_dongle prospector_adapter
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    snippet: zmk-usb-logging studio-rpc-usb-uart
    artifact-name: totem-dongle

  # Corne (standalone halves)
  - board: nice_nano//zmk
    shield: corne_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    snippet: studio-rpc-usb-uart
  - board: nice_nano//zmk
    shield: corne_right nice_view_adapter nice_view

  # Kometa (standalone halves)
  - board: nice_nano//zmk
    shield: kometa_left
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    snippet: studio-rpc-usb-uart
  - board: nice_nano//zmk
    shield: kometa_right

  # Corne+Kometa dongle: one firmware drives either board's halves.
  # Halves in peripheral mode (bond to the dongle instead of acting standalone).
  - board: nice_nano//zmk
    shield: corne_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne-dongle-left
  - board: nice_nano//zmk
    shield: corne_right nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne-dongle-right
  - board: nice_nano//zmk
    shield: kometa_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: kometa-dongle-left
  - board: nice_nano//zmk
    shield: kometa_right
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: kometa-dongle-right
  - board: xiao_ble//zmk
    shield: corne_dongle prospector_adapter
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    snippet: zmk-usb-logging studio-rpc-usb-uart
    artifact-name: corne-dongle

  # Universal dongle: totem + corne/kometa configs in one firmware,
  # switch between them with the Z+X combo (see universal_dongle.keymap).
  # No ZMK Studio here: one physical layout cannot represent both
  # keymap position schemes (totem 38-pos vs corne/kometa 42-pos).
  - board: xiao_ble//zmk
    shield: universal_dongle prospector_adapter
    snippet: zmk-usb-logging
    artifact-name: universal-dongle

  # Settings reset
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: xiao_reset_settings
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: nice_nano_reset_settings