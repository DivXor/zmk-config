include:
  # Totem (standalone halves as today + totem dongle)
  - board: xiao_ble//zmk
    shield: totem_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: totem-dongle-left
  - board: xiao_ble//zmk
    shield: totem_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: totem-dongle-right
  - board: xiao_ble//zmk
    shield: totem_dongle prospector_adapter
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    snippet: zmk-usb-logging studio-rpc-usb-uart
    artifact-name: totem-dongle

  # Corne (standalone halves)
  - board: nice_nano//zmk
    shield: corne_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    snippet: studio-rpc-usb-uart
  - board: nice_nano//zmk
    shield: corne_right nice_view_adapter nice_view

  # Kometa (standalone halves)
  - board: nice_nano//zmk
    shield: kometa_left
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    snippet: studio-rpc-usb-uart
  - board: nice_nano//zmk
    shield: kometa_right

  # Dongle halves in peripheral mode (bond to the dongle instead of
  # acting standalone); dedicated centrals for corne and kometa.
  - board: nice_nano//zmk
    shield: corne_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne-dongle-left
  - board: nice_nano//zmk
    shield: corne_right nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne-dongle-right
  - board: nice_nano//zmk
    shield: kometa_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: kometa-dongle-left
  - board: nice_nano//zmk
    shield: kometa_right
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: kometa-dongle-right
  - board: xiao_ble//zmk
    shield: corne_dongle prospector_adapter
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    snippet: zmk-usb-logging studio-rpc-usb-uart
    artifact-name: corne-dongle
  - board: xiao_ble//zmk
    shield: kometa_dongle prospector_adapter
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    snippet: zmk-usb-logging studio-rpc-usb-uart
    artifact-name: kometa-dongle

  # Experimental keymap variants (see docs/split-keymap-research.md).
  # ZMK's post_boards_shields.cmake honors a -DKEYMAP_FILE= override, so each
  # entry compiles one variant keymap (config/keymaps/<v>_<board>.keymap)
  # without dummy shields. The .conf behavior (config/totem.conf / kometa.conf)
  # is shared with the stock builds.

  # --- Variant A: "flo-core" (layer-tap thumbs, real mods on free hand) ---
  - board: xiao_ble//zmk
    shield: totem_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/flo_totem.keymap
    artifact-name: totem-flo-left
  - board: xiao_ble//zmk
    shield: totem_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/flo_totem.keymap
    artifact-name: totem-flo-right
  - board: xiao_ble//zmk
    shield: totem_dongle prospector_adapter
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/flo_totem.keymap
    snippet: zmk-usb-logging studio-rpc-usb-uart
    artifact-name: totem-flo-dongle
  - board: nice_nano//zmk
    shield: kometa_left
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/flo_kometa.keymap
    snippet: studio-rpc-usb-uart
    artifact-name: kometa-flo-left
  - board: nice_nano//zmk
    shield: kometa_right
    cmake-args: -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/flo_kometa.keymap
    artifact-name: kometa-flo-right
  - board: nice_nano//zmk
    shield: kometa_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/flo_kometa.keymap
    artifact-name: kometa-flo-dongle-left
  - board: nice_nano//zmk
    shield: kometa_right
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/flo_kometa.keymap
    artifact-name: kometa-flo-dongle-right
  - board: xiao_ble//zmk
    shield: kometa_dongle prospector_adapter
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/flo_kometa.keymap
    snippet: zmk-usb-logging studio-rpc-usb-uart
    artifact-name: kometa-flo-dongle

  # --- Variant B: "seniply-core" (sticky one-shot mods, pure thumb holds) ---
  - board: xiao_ble//zmk
    shield: totem_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/sen_totem.keymap
    artifact-name: totem-sen-left
  - board: xiao_ble//zmk
    shield: totem_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/sen_totem.keymap
    artifact-name: totem-sen-right
  - board: xiao_ble//zmk
    shield: totem_dongle prospector_adapter
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/sen_totem.keymap
    snippet: zmk-usb-logging studio-rpc-usb-uart
    artifact-name: totem-sen-dongle
  - board: nice_nano//zmk
    shield: kometa_left
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/sen_kometa.keymap
    snippet: studio-rpc-usb-uart
    artifact-name: kometa-sen-left
  - board: nice_nano//zmk
    shield: kometa_right
    cmake-args: -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/sen_kometa.keymap
    artifact-name: kometa-sen-right
  - board: nice_nano//zmk
    shield: kometa_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/sen_kometa.keymap
    artifact-name: kometa-sen-dongle-left
  - board: nice_nano//zmk
    shield: kometa_right
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/sen_kometa.keymap
    artifact-name: kometa-sen-dongle-right
  - board: xiao_ble//zmk
    shield: kometa_dongle prospector_adapter
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/sen_kometa.keymap
    snippet: zmk-usb-logging studio-rpc-usb-uart
    artifact-name: kometa-sen-dongle

  # --- Variant C: "callum-core" (half-layer mods on both thumbs) ---
  - board: xiao_ble//zmk
    shield: totem_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/cal_totem.keymap
    artifact-name: totem-cal-left
  - board: xiao_ble//zmk
    shield: totem_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/cal_totem.keymap
    artifact-name: totem-cal-right
  - board: xiao_ble//zmk
    shield: totem_dongle prospector_adapter
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/cal_totem.keymap
    snippet: zmk-usb-logging studio-rpc-usb-uart
    artifact-name: totem-cal-dongle
  - board: nice_nano//zmk
    shield: kometa_left
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/cal_kometa.keymap
    snippet: studio-rpc-usb-uart
    artifact-name: kometa-cal-left
  - board: nice_nano//zmk
    shield: kometa_right
    cmake-args: -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/cal_kometa.keymap
    artifact-name: kometa-cal-right
  - board: nice_nano//zmk
    shield: kometa_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/cal_kometa.keymap
    artifact-name: kometa-cal-dongle-left
  - board: nice_nano//zmk
    shield: kometa_right
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/keymaps/cal_kometa.keymap
